<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子式をつくろう</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8fc;color:#18324a;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
h1{margin:15px 5px 8px;font-size:28px}h2{margin:10px 5px;font-size:23px}p{margin:8px}
button{margin:5px;padding:11px 15px;background:#fff;color:#176db7;border:2px solid #79a8d1;border-radius:12px;font-size:18px;cursor:pointer}
#menu{max-width:800px;margin:auto}#game{display:none}
#board{position:relative;width:min(96vw,1100px);height:clamp(440px,68vh,590px);margin:10px auto 16px;background:#fff;border:3px solid #8ab0dc;border-radius:20px;overflow:hidden;touch-action:none}
.ring,.atom,.electron{position:absolute;transform:translate(-50%,-50%)}
.ring{width:84px;height:84px;border:2px dashed #d5e0e9;border-radius:50%;pointer-events:none}
.atom{width:70px;height:70px;line-height:70px;border-radius:50%;color:#fff;font-size:27px;font-weight:bold;z-index:2}
.h{background:#e77373}.o{background:#5289d2}.c{background:#555}.n{background:#4f9b72}.cl{background:#54a66c}
.electron{width:30px;height:30px;line-height:26px;border-radius:50%;background:#ffe36b;border:2px solid #b99400;color:#18324a;font-size:20px;z-index:5;cursor:grab;user-select:none}
.electron.ok{background:#79d67b;border-color:#278d36}.electron.ng{background:#ff9b9b;border-color:#d52f2f}
#msg{min-height:30px;margin:8px;font-weight:bold;color:#14528f}
</style>
</head>
<body>
<h1>電子式をつくろう</h1>

<div id="menu">
<p>つくる分子を選んでください。</p>
<button onclick="start('h2')">H₂</button>
<button onclick="start('hcl')">HCl</button>
<button onclick="start('h2o')">H₂O</button>
<button onclick="start('co2')">CO₂</button>
<button onclick="start('n2')">N₂</button>
<button onclick="start('nh3')">NH₃</button>
</div>

<div id="game">
<h2 id="title"></h2>
<p>電子を輪にドラッグしよう。</p>
<div id="board"></div>
<button onclick="check()">正誤判定</button>
<button onclick="draw()">最初から</button>
<button onclick="back()">分子を選ぶ</button>
<p id="msg"></p>
</div>

<script>
const board=document.getElementById("board");
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const title=document.getElementById("title");
const msg=document.getElementById("msg");
let molecule=null,electrons=[];

const data={
h2:{title:"H₂ の電子式",atoms:[["H","h",.35,.42],["H","h",.65,.42]],b:[[[.50,.42],2]],l:[]},
hcl:{title:"HCl の電子式",atoms:[["H","h",.30,.42],["Cl","cl",.70,.42]],b:[[[.50,.42],2]],l:[[.70,.22],[.70,.62],[.88,.42]]},
h2o:{title:"H₂O の電子式",atoms:[["H","h",.22,.43],["O","o",.50,.43],["H","h",.78,.43]],b:[[[.36,.43],2],[[.64,.43],2]],l:[[.50,.22],[.50,.64]]},
co2:{
title:"CO₂ の電子式",
atoms:[["O","o",.25,.42],["C","c",.50,.42],["O","o",.75,.42]],
b:[[[.375,.42],4],[[.625,.42],4]],
l:[[.25,.22],[.25,.62],[.75,.22],[.75,.62]]
},
n2:{title:"N₂ の電子式",atoms:[["N","n",.35,.42],["N","n",.65,.42]],b:[[[.50,.42],6]],l:[[.16,.42],[.84,.42]]},
nh3:{title:"NH₃ の電子式",atoms:[["H","h",.25,.33],["N","n",.50,.33],["H","h",.75,.33],["H","h",.50,.70]],b:[[[.375,.33],2],[[.625,.33],2],[[.50,.515],2]],l:[[.50,.14]]}
};

function put(x,y,text,className){
 const el=document.createElement("div");
 el.className=className;el.style.left=x*100+"%";el.style.top=y*100+"%";
 el.textContent=text;board.appendChild(el);return el;
}

function start(key){
 molecule=data[key];title.textContent=molecule.title;
 menu.style.display="none";game.style.display="block";draw();
}

function draw(){
 board.innerHTML="";electrons=[];msg.textContent="";
 molecule.b.forEach(v=>put(v[0][0],v[0][1],"","ring"));
 molecule.l.forEach(v=>put(v[0],v[1],"","ring"));
 molecule.atoms.forEach(v=>put(v[2],v[3],v[0],"atom "+v[1]));

 const total=molecule.b.reduce((s,v)=>s+v[1],0)+molecule.l.length*2;
 const columns=Math.min(8,total);
 const rows=Math.ceil(total/columns);

 for(let i=0;i<total;i++){
   const col=i%columns,row=Math.floor(i/columns);
   const x=(col+1)/(columns+1);
   const y=rows===1?.87:(row===0?.78:.91);
   const el=put(x,y,"●","electron");
   setDrag(el);electrons.push(el);
 }
}

function setDrag(el){
 el.addEventListener("pointerdown",ev=>{
   el.setPointerCapture(ev.pointerId);
   const move=e=>{
     const r=board.getBoundingClientRect();
     let x=(e.clientX-r.left)/r.width;
     let y=(e.clientY-r.top)/r.height;
     x=Math.max(.02,Math.min(.98,x));
     y=Math.max(.02,Math.min(.96,y));
     el.style.left=x*100+"%";el.style.top=y*100+"%";
   };
   el.addEventListener("pointermove",move);
   el.addEventListener("pointerup",()=>el.removeEventListener("pointermove",move),{once:true});
 });
}

function check(){
 const zones=[];
 molecule.b.forEach((v,i)=>zones.push({id:"b"+i,x:v[0][0],y:v[0][1],need:v[1],count:0}));
 molecule.l.forEach((v,i)=>zones.push({id:"l"+i,x:v[0],y:v[1],need:2,count:0}));

 const rect=board.getBoundingClientRect(),belongs=[];
 electrons.forEach(el=>{
   const x=parseFloat(el.style.left)/100,y=parseFloat(el.style.top)/100;
   let near=-1,min=Infinity;
   zones.forEach((z,i)=>{
     const d=Math.hypot((x-z.x)*rect.width,(y-z.y)*rect.height);
     if(d<min){min=d;near=i;}
   });
   if(min<=42){belongs.push(near);zones[near].count++;}
   else belongs.push(-1);
 });

 electrons.forEach((el,i)=>{
   const n=belongs[i];
   el.className=n>=0&&zones[n].count===zones[n].need?"electron ok":"electron ng";
 });
 msg.textContent=zones.every(z=>z.count===z.need)?"正解！ よくできました。":"緑の電子は正しい位置です。赤い電子を動かしましょう。";
}

function back(){board.innerHTML="";game.style.display="none";menu.style.display="block";}
</script>
</body>
</html>
