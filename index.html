<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子式をつくろう</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;text-align:center;font-family:sans-serif;
  background:#f3f8fc;color:#18324a
}
h1{margin:18px 8px 6px}
#menu{max-width:760px;margin:20px auto}
#menu button{
  width:126px;height:64px;margin:6px;
  border:2px solid #79a8d1;border-radius:14px;
  background:#fff;font-size:22px;cursor:pointer
}
#game{display:none}
#board{
  position:relative;
  width:min(96vw,900px);
  height:560px;
  margin:12px auto;
  overflow:hidden;
  background:#fff;
  border:3px solid #8ab0dc;
  border-radius:18px;
  touch-action:none
}
.ring{
  position:absolute;
  width:84px;height:84px;
  border:2px dashed #d5e0e9;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:1;
  opacity:.9;
}
.guide-ring{
  border-color:#d5e0e9;
  opacity:.9;
}.guide-ring{
  border-color:#d5e0e9;
  opacity:.9
}
.atom{
  position:absolute;
  width:70px;height:70px;
  line-height:70px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  color:#fff;font-size:27px;font-weight:bold;
  z-index:3;cursor:pointer;user-select:none
}
.h{background:#e77373}
.o{background:#5289d2}
.c{background:#555}
.n{background:#4f9b72}
.cl{background:#54a66c}
.e{
  position:absolute;
  width:28px;height:28px;
  line-height:26px;
  border-radius:50%;
  background:#ffe36b;
  border:1px solid #b99400;
  font-size:20px;
  cursor:grab;
  user-select:none;
  z-index:6
}
.e:active{cursor:grabbing}
.e.correct{background:#79d67b;border-color:#238c2a}
.e.wrong{background:#ff8a8a;border-color:#b90000}
.hint-dot{
  position:absolute;
  width:12px;height:12px;
  border-radius:50%;
  background:#8a36cc;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:5
}
.controls button{
  margin:4px;padding:10px 14px;
  border:1px solid #6d9ec9;
  border-radius:8px;
  background:#fff;
  font-size:16px;
  cursor:pointer
}
#hintBtn.on{
  background:#d9efff;
  border-color:#2475b5
}
#msg{
  min-height:28px;
  font-weight:bold;
  color:#14528f
}
</style>
</head>
<body>

<h1>電子式をつくろう</h1>

<div id="menu">
  <p>つくる分子を選んでください。</p>
  <button onclick="startGame('h2')">H₂</button>
  <button onclick="startGame('hcl')">HCl</button>
  <button onclick="startGame('h2o')">H₂O</button>
  <button onclick="startGame('co2')">CO₂</button>
  <button onclick="startGame('n2')">N₂</button>
  <button onclick="startGame('nh3')">NH₃</button>
</div>

<div id="game">
  <h2 id="title"></h2>
  <p>電子を輪にドラッグしよう。</p>

  <div id="board"></div>

  <div class="controls">
    <button id="hintBtn" onclick="toggleHintMode()">ヒント：OFF</button>
    <button onclick="check()">正誤判定</button>
    <button onclick="reset()">最初から</button>
    <button onclick="backToMenu()">分子を選ぶ</button>
  </div>

  <p id="msg"></p>
</div>

<script>
const board=document.querySelector("#board");
const menu=document.querySelector("#menu");
const game=document.querySelector("#game");
const title=document.querySelector("#title");
const msg=document.querySelector("#msg");
const hintBtn=document.querySelector("#hintBtn");

let current;
let dots=[];
let starts=[];
let hintMode=false;
let shownHints=new Set();

const molecules={
  h2:{
    name:"H₂ の電子式",
    atoms:[
      {el:"H",type:"h",p:[.35,.42]},
      {el:"H",type:"h",p:[.65,.42]}
    ],
    bonds:[
      {p:[.50,.42],need:2}
    ],
    lonePools:[]
  },

  hcl:{
    name:"HCl の電子式",
    atoms:[
      {el:"H",type:"h",p:[.30,.42]},
      {el:"Cl",type:"cl",p:[.70,.42]}
    ],
    bonds:[
      {p:[.50,.42],need:2}
    ],
    lonePools:[
      {
        pairs:3,
        slots:[
          [.70,.24],
          [.70,.60],
          [.88,.42]
        ]
      }
    ]
  },

  h2o:{
    name:"H₂O の電子式",
    atoms:[
      {el:"H",type:"h",p:[.22,.43]},
      {el:"O",type:"o",p:[.50,.43]},
      {el:"H",type:"h",p:[.78,.43]}
    ],
    bonds:[
      {p:[.36,.43],need:2},
      {p:[.64,.43],need:2}
    ],
    lonePools:[
      {
        pairs:2,
        slots:[
          [.50,.25],
          [.50,.61]
        ]
      }
    ]
  },

  co2:{
    name:"CO₂ の電子式",
    atoms:[
      {el:"O",type:"o",p:[.25,.42]},
      {el:"C",type:"c",p:[.50,.42]},
      {el:"O",type:"o",p:[.75,.42]}
    ],
    bonds:[
      {p:[.375,.42],need:4},
      {p:[.625,.42],need:4}
    ],
    lonePools:[
      {
        pairs:2,
        slots:[
          [.25,.24],
          [.25,.60],
          [.07,.42]
        ]
      },
      {
        pairs:2,
        slots:[
          [.75,.24],
          [.75,.60],
          [.93,.42]
        ]
      }
    ]
  },

  n2:{
    name:"N₂ の電子式",
    atoms:[
      {el:"N",type:"n",p:[.35,.42]},
      {el:"N",type:"n",p:[.65,.42]}
    ],
    bonds:[
      {p:[.50,.42],need:6}
    ],
    lonePools:[
      {
        pairs:1,
        slots:[
          [.35,.24],
          [.35,.60],
          [.17,.42]
        ]
      },
      {
        pairs:1,
        slots:[
          [.65,.24],
          [.65,.60],
          [.83,.42]
        ]
      }
    ]
  },

  nh3:{
    name:"NH₃ の電子式",
    atoms:[
      {el:"N",type:"n",p:[.50,.33]},
      {el:"H",type:"h",p:[.25,.33]},
      {el:"H",type:"h",p:[.75,.33]},
      {el:"H",type:"h",p:[.50,.70]}
    ],
    bonds:[
      {p:[.375,.33],need:2},
      {p:[.625,.33],need:2},
      {p:[.50,.515],need:2}
    ],
    lonePools:[
      {
        pairs:1,
        slots:[
          [.50,.15]
        ]
      }
    ]
  }
};

function xy(p){
  return [
    p[0]*board.clientWidth,
    p[1]*board.clientHeight
  ];
}

function startGame(key){
  current=molecules[key];
  menu.style.display="none";
  game.style.display="block";

  title.textContent=current.name;
  msg.textContent="";
  hintMode=false;
  shownHints.clear();

  hintBtn.textContent="ヒント：OFF";
  hintBtn.classList.remove("on");

  draw();
}

function addRing(p,isGuide=false){
  const [x,y]=xy(p);
  const ring=document.createElement("div");

  ring.className=isGuide
    ?"ring guide-ring"
    :"ring";

  ring.style.left=x+"px";
  ring.style.top=y+"px";

  board.appendChild(ring);
}

function allActualSlots(){
  const slots=[];

  current.bonds.forEach(b=>slots.push(b.p));

  current.lonePools.forEach(pool=>{
    pool.slots.forEach(slot=>slots.push(slot));
  });

  return slots;
}

function nearActualSlot(p){
  return allActualSlots().some(slot=>{
    return Math.hypot(p[0]-slot[0],p[1]-slot[1])<0.055;
  });
}

function facesAnotherAtom(atom,dir){
  for(const other of current.atoms){
    if(other===atom)continue;

    const dx=other.p[0]-atom.p[0];
    const dy=other.p[1]-atom.p[1];

    if(dir==="r" && dx>0 && Math.abs(dy)<0.04)return true;
    if(dir==="l" && dx<0 && Math.abs(dy)<0.04)return true;
    if(dir==="u" && dy<0 && Math.abs(dx)<0.04)return true;
    if(dir==="d" && dy>0 && Math.abs(dx)<0.04)return true;
  }

  return false;
}

function insideBoard(p){
  return p[0]>=.07 && p[0]<=.93 &&
         p[1]>=.08 && p[1]<=.82;
}

function draw(){
  board.innerHTML="";
  dots=[];

  /* 電子を置く正解の輪 */
  current.bonds.forEach(bond=>addRing(bond.p));

  current.lonePools.forEach(pool=>{
    pool.slots.forEach(slot=>addRing(slot));
  });

  /* 元素の共有結合していない上下左右に薄い案内輪 */
  current.atoms.forEach(atom=>{
    const x=atom.p[0];
    const y=atom.p[1];

    const directions=[
      {dir:"u",p:[x,y-.18]},
      {dir:"r",p:[x+.18,y]},
      {dir:"d",p:[x,y+.18]},
      {dir:"l",p:[x-.18,y]}
    ];

    directions.forEach(item=>{
      if(
        !facesAnotherAtom(atom,item.dir) &&
        !nearActualSlot(item.p) &&
        insideBoard(item.p)
      ){
        addRing(item.p,true);
      }
    });
  });

  current.atoms.forEach((atom,index)=>{
    const [x,y]=xy(atom.p);
    const el=document.createElement("div");

    el.className="atom "+atom.type;
    el.textContent=atom.el;
    el.style.left=x+"px";
    el.style.top=y+"px";
    el.onclick=()=>clickAtom(index);

    board.appendChild(el);
  });

  const bondElectrons=current.bonds.reduce(
    (sum,bond)=>sum+bond.need,0
  );

  const loneElectrons=current.lonePools.reduce(
    (sum,pool)=>sum+pool.pairs*2,0
  );

  const total=bondElectrons+loneElectrons;
  const cols=Math.max(
    6,
    Math.floor((board.clientWidth-22)/38)
  );

  for(let i=0;i<total;i++){
    const e=document.createElement("div");

    e.className="e";
    e.textContent="●";
    e.style.left=(15+(i%cols)*38)+"px";
    e.style.top=(478+Math.floor(i/cols)*34)+"px";

    setDrag(e);
    board.appendChild(e);
    dots.push(e);
  }

  starts=dots.map(e=>[e.style.left,e.style.top]);
}

function toggleHintMode(){
  hintMode=!hintMode;
  shownHints.clear();

  board.querySelectorAll(".hint-dot").forEach(dot=>dot.remove());

  hintBtn.textContent=hintMode
    ?"ヒント：ON"
    :"ヒント：OFF";

  hintBtn.classList.toggle("on",hintMode);

  msg.textContent=hintMode
    ?"元素記号をクリックすると電子式を表示します。"
    :"";
}

function clickAtom(index){
  if(!hintMode)return;

  if(shownHints.has(index)){
    shownHints.delete(index);
  }else{
    shownHints.add(index);
  }

  board.querySelectorAll(".hint-dot").forEach(dot=>dot.remove());

  shownHints.forEach(i=>showHint(current.atoms[i]));
}

function showHint(atom){
  const patterns={
    H:[["r"]],
    C:[["u"],["r"],["d"],["l"]],
    N:[["u","u"],["r"],["d"],["l"]],
    O:[["u","u"],["r","r"],["d"],["l"]],
    Cl:[["u","u"],["r","r"],["d","d"],["l"]]
  };

  const [cx,cy]=xy(atom.p);

  const dirs={
    u:[0,-48],
    r:[48,0],
    d:[0,48],
    l:[-48,0]
  };

  patterns[atom.el].forEach(group=>{
    group.forEach((side,index)=>{
      const [dx,dy]=dirs[side];
      const shift=group.length===2
        ?(index===0?-7:7)
        :0;

      const dot=document.createElement("div");
      dot.className="hint-dot";

      dot.style.left=(
        cx+dx+
        ((side==="u"||side==="d")?shift:0)
      )+"px";

      dot.style.top=(
        cy+dy+
        ((side==="l"||side==="r")?shift:0)
      )+"px";

      board.appendChild(dot);
    });
  });
}

function setDrag(e){
  e.addEventListener("pointerdown",event=>{
    e.classList.remove("correct","wrong");
    msg.textContent="";

    e.setPointerCapture(event.pointerId);

    const er=e.getBoundingClientRect();
    const br=board.getBoundingClientRect();

    const dx=event.clientX-er.left;
    const dy=event.clientY-er.top;

    const move=ev=>{
      e.style.left=Math.max(
        0,
        Math.min(
          br.width-28,
          ev.clientX-br.left-dx
        )
      )+"px";

      e.style.top=Math.max(
        0,
        Math.min(
          br.height-28,
          ev.clientY-br.top-dy
        )
      )+"px";
    };

    e.addEventListener("pointermove",move);

    e.addEventListener("pointerup",()=>{
      e.removeEventListener("pointermove",move);
    },{once:true});
  });
}

function check(){
  const zones=[];

  current.bonds.forEach((bond,index)=>{
    const [x,y]=xy(bond.p);

    zones.push({
      type:"bond",
      group:index,
      x,y,
      need:bond.need,
      count:0
    });
  });

  current.lonePools.forEach((pool,poolIndex)=>{
    pool.slots.forEach(slot=>{
      const [x,y]=xy(slot);

      zones.push({
        type:"lone",
        group:poolIndex,
        x,y,
        need:2,
        count:0
      });
    });
  });

  const assigned=[];

  dots.forEach(e=>{
    const x=parseFloat(e.style.left)+14;
    const y=parseFloat(e.style.top)+14;

    let nearest=-1;
    let min=Infinity;

    zones.forEach((zone,index)=>{
      const distance=Math.hypot(x-zone.x,y-zone.y);

      if(distance<min){
        min=distance;
        nearest=index;
      }
    });

    if(min<=42){
      zones[nearest].count++;
      assigned.push(nearest);
    }else{
      assigned.push(-1);
    }
  });

  const bondOK=current.bonds.map((bond,index)=>{
    const zone=zones.find(z=>
      z.type==="bond" && z.group===index
    );

    return zone.count===bond.need;
  });

  const loneOK=current.lonePools.map((pool,poolIndex)=>{
    const poolZones=zones.filter(z=>
      z.type==="lone" && z.group===poolIndex
    );

    const total=poolZones.reduce(
      (sum,zone)=>sum+zone.count,0
    );

    /* 非共有電子は必ず同じ輪に2個ずつ置く */
    const paired=poolZones.every(zone=>
      zone.count===0 || zone.count===2
    );

    return total===pool.pairs*2 && paired;
  });

  dots.forEach((e,index)=>{
    e.classList.remove("correct","wrong");

    const zoneIndex=assigned[index];

    if(zoneIndex<0){
      e.classList.add("wrong");
      return;
    }

    const zone=zones[zoneIndex];

    const ok=zone.type==="bond"
      ?bondOK[zone.group]
      :loneOK[zone.group];

    e.classList.add(ok?"correct":"wrong");
  });

  const correct=
    bondOK.every(Boolean) &&
    loneOK.every(Boolean);

  msg.textContent=correct
    ?"正解！ よくできました。"
    :"緑の電子は正しい位置です。赤い電子を動かしましょう。";
}

function reset(){
  dots.forEach((e,index)=>{
    e.style.left=starts[index][0];
    e.style.top=starts[index][1];
    e.classList.remove("correct","wrong");
  });

  msg.textContent="";
}

function backToMenu(){
  game.style.display="none";
  menu.style.display="block";
  board.innerHTML="";
  shownHints.clear();
  hintMode=false;
}
</script>
</body>
</html>
